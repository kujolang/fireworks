[package]
name = "fireworks"
version = "0.1.1"
description = "Native Fireworks chat client for Kujo with an AI SDK driver."
license = "MIT"
repository = "https://github.com/kujolang/fireworks"
readme = "README.md"
[package.status]
stage = "experimental"
stability = "early"
public_api = true
[kujo]
minimum_version = "1.0.2"
entry = "fireworks.kujo"
sources = ["src", "."]
includes = ["docs", "examples", "README.md", "CHANGELOG.md", "tests", "AGENTS.md", "docs/FIREWORKS_IMPLEMENTATION_REPORT.md", "docs/FIREWORKS_PROVIDER_PACKAGE_CONFORMANCE.md"]
excludes = [".git", "dist", "build", "kennel_packages"]
[dependencies]
ai-sdk = { source = "github:kujolang/ai-sdk", ref = "v1.1.0" }
[scripts]
test = "bash scripts/release_quality_gate.sh"
verify-offline = "bash scripts/release_quality_gate.sh"
[package.exports]
fireworks = "src/fireworks.kujo"
provider = "src/provider.kujo"
